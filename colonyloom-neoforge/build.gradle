tasks.register('deliverySmoke') {
    group = 'verification'
    description = 'Exercises real courier cargo, cancellation, full buffers, safe return and clean restart in disposable dedicated JVMs.'
    dependsOn provider {
        def run = tasks.named('runDelivery', JavaExec).get()
        run.taskDependencies.getDependencies(run)
    }
