plugins { id 'net.neoforged.moddev' }
evaluationDependsOn(':colonyloom-minecraft')
dependencies { implementation project(':colonyloom-minecraft') }
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}
neoForge {
    version = project.neo_version
    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }
    addModdingDependenciesTo(sourceSets.gameTest)
    mods {
        colonyloom {
            sourceSet sourceSets.main
            sourceSet project(':colonyloom-core').sourceSets.main
            sourceSet project(':colonyloom-gameplay').sourceSets.main
            sourceSet project(':colonyloom-minecraft').sourceSets.main
        }
        colonyloom_tests { sourceSet sourceSets.gameTest }
    }
    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
            loadedMods = [mods.colonyloom]
        }
        client {
            client()
            gameDirectory = project.file('runs/client')
            loadedMods = [mods.colonyloom, mods.colonyloom_tests]
        }
        client2 {
            client()
            programArguments.addAll('--username', 'ColonyloomGuest')
            gameDirectory = project.file('runs/client2')
            loadedMods = [mods.colonyloom, mods.colonyloom_tests]
        }
        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('runs/server')
            jvmArguments.addAll('-Xms4G', '-Xmx4G')
            loadedMods = [mods.colonyloom, mods.colonyloom_tests]
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('runs/gametest')
            sourceSet = sourceSets.gameTest
            loadedMods = [mods.colonyloom, mods.colonyloom_tests]
            systemProperty 'neoforge.enabledGameTestNamespaces', 'colonyloom'
        }
    }
}
def metadata = tasks.register('generateModMetadata', ProcessResources) {
    def values = [mod_id: project.mod_id, mod_name: project.mod_name, mod_version: project.mod_version]
    inputs.properties values
    expand values
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/modMetadata')
}
sourceSets.main.resources.srcDir metadata
neoForge.ideSyncTask metadata
tasks.named('jar', Jar) {
    archiveBaseName = 'colonyloom'
    duplicatesStrategy = DuplicatesStrategy.FAIL
    ['colonyloom-core', 'colonyloom-gameplay', 'colonyloom-minecraft'].each { name ->
        from project(":$name").sourceSets.main.output
    }
    from(rootProject.file('LICENSE'))
}
tasks.named('runServer', JavaExec) {
    standardInput = System.in
}

// Test-only named run supplies the exact ModDevGradle launch classpath/environment to child JVMs.
neoForge.runs {
    construction {
        server()
        programArgument '--nogui'
        gameDirectory = project.file('runs/construction')
        loadedMods = [neoForge.mods.colonyloom, neoForge.mods.colonyloom_tests]
        jvmArguments.addAll('-Xms4G', '-Xmx4G')
    }
}
tasks.register('constructionSmoke') {
    group = 'verification'
    description = 'Runs four-stair public build, clean continuation, cancellation and safeguarded crash/restart in disposable dedicated JVMs.'
    // Prepare exactly the same runtime as runConstruction, but do not execute that long-lived run task.
    dependsOn provider {
        def run = tasks.named('runConstruction', JavaExec).get()
        run.taskDependencies.getDependencies(run)
    }
    doLast {
        def run = tasks.named('runConstruction', JavaExec).get()
        def acceptedEula = file(providers.gradleProperty('colonyloomEulaFile').getOrElse('runs/server/eula.txt'))
        if (!acceptedEula.isFile() || !acceptedEula.readLines().any { it.trim() == 'eula=true' }) {
            throw new GradleException('Provide an already accepted disposable-instance EULA using -PcolonyloomEulaFile=<path>; the runner does not accept legal terms.')
        }
        def report = layout.buildDirectory.dir('reports/colonyloom/construction-' + java.time.Instant.now().toEpochMilli()).get().asFile
        report.mkdirs()
        def selected = providers.gradleProperty('colonyloomConstructionScenario').getOrElse('all')
        def scenarios = ['clean', 'cancel', 'BEFORE_BLOCK_CHANGE', 'AFTER_BLOCK_CHANGE']
        if (selected != 'all') {
            if (!scenarios.contains(selected)) throw new GradleException('Unknown construction scenario: ' + selected)
            scenarios = [selected]
        }
        def results = []
        scenarios.each { scenario ->
            def instance = new File(report, scenario)
            def world = new File(instance, 'world')
            world.mkdirs()
            java.nio.file.Files.copy(acceptedEula.toPath(), new File(instance, 'eula.txt').toPath())
            new File(world, 'colonyloom-test-world').text = 'Disposable Colonyloom construction runner: ' + scenario + '\n'
            new File(instance, 'server.properties').text = '''level-name=world
level-seed=424242
level-type=minecraft:flat
generator-settings={"biome":"minecraft:plains","layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}]}
online-mode=false
server-port=0
enable-rcon=false
enable-query=false
spawn-protection=0
view-distance=6
simulation-distance=6
gamemode=survival
difficulty=peaceful
spawn-monsters=false
spawn-animals=false
max-tick-time=120000
'''
            ['initialize', 'exercise', 'verify'].each { phase ->
                def fault = phase == 'exercise' && scenario in ['BEFORE_BLOCK_CHANGE', 'AFTER_BLOCK_CHANGE']
                int expectedExit = fault ? 97 : 0
                def argv = [run.javaLauncher.get().executablePath.asFile.absolutePath]
                argv.addAll(run.allJvmArgs)
                argv.addAll(['-Dcolonyloom.test.identityAction=', '-Dcolonyloom.test.constructionScenario=' + scenario,
                        '-Dcolonyloom.test.constructionPhase=' + phase, '-Dcolonyloom.testFaults=' + fault])
                def launchClasspath = run.classpath + run.classpathProvider
                if (!launchClasspath.isEmpty()) argv.addAll(['-cp', launchClasspath.asPath])
                argv.add(run.mainClass.get())
                argv.addAll(run.args)
                def stdout = new File(instance, phase + '.stdout.log')
                def stderr = new File(instance, phase + '.stderr.log')
                def builder = new ProcessBuilder(argv.collect { it.toString() }).directory(instance)
                run.environment.each { key, value -> builder.environment().put(key.toString(), value.toString()) }
                run.environmentProperty.get().each { key, value -> builder.environment().put(key.toString(), value.toString()) }
                builder.redirectOutput(stdout).redirectError(stderr)
                def started = System.nanoTime()
                def child = builder.start()
                boolean exited = child.waitFor(240, java.util.concurrent.TimeUnit.SECONDS)
                if (!exited) {
                    // Only our own disposable child is stopped; diagnostic files retain its last state.
                    child.destroy()
                    if (!child.waitFor(20, java.util.concurrent.TimeUnit.SECONDS)) child.destroyForcibly().waitFor(10, java.util.concurrent.TimeUnit.SECONDS)
                }
                def observation = new File(world, 'colonyloom-construction-observations.jsonl')
                def facts = observation.isFile() ? observation.readLines().findAll { !it.isBlank() }.collect { new groovy.json.JsonSlurper().parseText(it) } : []
                def expectedCheck = phase == 'initialize' ? 'initial_clean_checkpoint_requested' :
                        phase == 'exercise' ? (fault ? 'expected_fault' : scenario == 'clean' ? 'clean_partial_stop' : 'cancel_after_two') :
                        scenario == 'clean' ? 'clean_continuation_complete' : scenario == 'cancel' ? 'cancel_restart_complete' : 'crash_recovery_complete'
                def phaseFacts = facts.findAll { it.scenario == scenario && it.phase == phase }
                def passed = exited && child.exitValue() == expectedExit && phaseFacts.any { it.check == expectedCheck && it.passed } && !phaseFacts.any { !it.passed }
                passed = passed && (fault || phaseFacts.any { it.check == 'production_clean_checkpoint_confirmed' && it.passed })
                if (phase == 'initialize') passed = passed && phaseFacts.any { it.check == 'initial_durable_open_goal' && it.passed }
                if (fault) passed = passed && phaseFacts.any { it.check == 'durable_prepared_effect' && it.passed }
                results.add([scenario: scenario, phase: phase, expectedExit: expectedExit, exit: child.isAlive() ? null : child.exitValue(),
                        timedOut: !exited, elapsedMillis: (System.nanoTime() - started) / 1_000_000L,
                        stdout: stdout.absolutePath, stderr: stderr.absolutePath, observation: observation.absolutePath, facts: phaseFacts, passed: passed])
                new File(report, 'report.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                        java: run.javaLauncher.get().metadata.languageVersion.toString(), neoForge: project.neo_version,
                        seed: 424242, heap: '4GiB', phases: results]))
                if (!passed) throw new GradleException("Construction ${scenario}/${phase} failed (exit=${child.isAlive() ? 'alive' : child.exitValue()}, expected=${expectedExit}, timeout=${!exited}); see ${report}")
            }
        }
        logger.lifecycle('Construction dedicated crash/restart evidence: {}', report)
    }
}
