tasks.register('storageSmoke') {
    group = 'verification'
    description = 'Exercises canonical stock, real hoppers, replacement, explicit identity repair and clean restart in disposable dedicated JVMs.'
    dependsOn provider {
        def run = tasks.named('runStorage', JavaExec).get()
        run.taskDependencies.getDependencies(run)
    }
    doLast {
        def run = tasks.named('runStorage', JavaExec).get()
        def acceptedEula = file(providers.gradleProperty('colonyloomEulaFile').getOrElse('runs/server/eula.txt'))
        if (!acceptedEula.isFile() || !acceptedEula.readLines().any { it.trim() == 'eula=true' }) throw new GradleException('Storage runner requires an already accepted EULA.')
        def report = layout.buildDirectory.dir('reports/colonyloom/storage-' + java.time.Instant.now().toEpochMilli()).get().asFile
        def instance = new File(report, 'instance');def world = new File(instance, 'world');world.mkdirs()
        java.nio.file.Files.copy(acceptedEula.toPath(), new File(instance, 'eula.txt').toPath())
        new File(world, 'colonyloom-test-world').text = 'Disposable Colonyloom stock runner\n'
        new File(instance, 'server.properties').text = '''level-name=world
level-seed=424242
level-type=minecraft:flat
generator-settings={"biome":"minecraft:plains","layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}]}
online-mode=false
server-port=0
enable-rcon=false
enable-query=false
spawn-protection=0
view-distance=6
simulation-distance=6
gamemode=survival
difficulty=peaceful
spawn-monsters=false
spawn-animals=false
max-tick-time=120000
'''
        def results = []
        ['exercise','verify'].each { phase ->
            def argv = [run.javaLauncher.get().executablePath.asFile.absolutePath];argv.addAll(run.allJvmArgs)
            argv.addAll(['-Dcolonyloom.test.storagePhase=' + phase, '-Dcolonyloom.test.identityAction=', '-Dcolonyloom.test.platformScenario=', '-Dcolonyloom.test.constructionScenario='])
            def launchClasspath = run.classpath + run.classpathProvider
            if (!launchClasspath.isEmpty()) argv.addAll(['-cp', launchClasspath.asPath])
            argv.add(run.mainClass.get());argv.addAll(run.args)
            def stdout = new File(instance, phase + '.stdout.log'),stderr = new File(instance, phase + '.stderr.log')
            def builder = new ProcessBuilder(argv.collect { it.toString() }).directory(instance)
            run.environment.each { key, value -> builder.environment().put(key.toString(), value.toString()) }
            run.environmentProperty.get().each { key, value -> builder.environment().put(key.toString(), value.toString()) }
            builder.redirectOutput(stdout).redirectError(stderr)
            def child = builder.start();boolean exited = child.waitFor(240, java.util.concurrent.TimeUnit.SECONDS)
            if (!exited) {child.destroy();if (!child.waitFor(20, java.util.concurrent.TimeUnit.SECONDS)) child.destroyForcibly().waitFor(10, java.util.concurrent.TimeUnit.SECONDS)}
            def observation = new File(world, 'colonyloom-storage-observations.jsonl')
            def facts = observation.isFile() ? observation.readLines().findAll { !it.isBlank() }.collect { new groovy.json.JsonSlurper().parseText(it) }.findAll { it.phase == phase } : []
            boolean passed = exited && child.exitValue() == 0 && facts.any { it.check == phase + '_complete' && it.passed } && facts.any { it.check == 'clean_checkpoint' && it.passed } && !facts.any { !it.passed }
            results.add([phase:phase,exit:child.isAlive() ? null : child.exitValue(),timedOut:!exited,stdout:stdout.absolutePath,stderr:stderr.absolutePath,facts:facts,passed:passed])
            new File(report,'report.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([seed:424242,heap:'4GiB',phases:results]))
            if (!passed) throw new GradleException("Stock ${phase} failed; see ${report}")
        }
        logger.lifecycle('Canonical stock dedicated evidence: {}',report)
    }
}

