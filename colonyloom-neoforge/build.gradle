tasks.register('recoverySmoke') {
    group = 'verification'
    description = 'Runs real clean continuation and guarded economic effect crash/restart matrices.'
    dependsOn 'constructionSmoke'
    dependsOn provider {
        def run = tasks.named('runRecovery', JavaExec).get()
        run.taskDependencies.getDependencies(run)
    }
    doLast {
        def run = tasks.named('runRecovery', JavaExec).get()
        def acceptedEula = file(providers.gradleProperty('colonyloomEulaFile').getOrElse('runs/server/eula.txt'))
        if (!acceptedEula.isFile() || !acceptedEula.readLines().any { it.trim() == 'eula=true' }) throw new GradleException('Recovery runner requires an already accepted disposable-instance EULA.')
        def scenarios = ['transfer_clean','transfer_before_effect','transfer_after_source_change','transfer_after_destination_change','transfer_after_fact_before_notify',
                'craft_clean','craft_before_effect','craft_after_source_change','craft_after_destination_change','craft_after_fact_before_notify',
                'food_clean','food_before_effect','food_after_source_change','food_after_fact_before_notify',
                'death_clean','death_before_effect','death_after_source_change','death_after_destination_change','death_after_fact_before_notify']
        def selected = providers.gradleProperty('colonyloomRecoveryScenario').getOrElse('all')
        if (selected != 'all') {
            def names = selected.split(',').toList()
            if (names.any { !scenarios.contains(it) }) throw new GradleException('Unknown recovery scenario: ' + selected)
            scenarios = names
        }
        def report = layout.buildDirectory.dir('reports/colonyloom/recovery-' + java.time.Instant.now().toEpochMilli()).get().asFile
        report.mkdirs()
        def results = []
        scenarios.each { scenario ->
            def instance = new File(report, scenario), world = new File(instance, 'world')
            world.mkdirs()
            java.nio.file.Files.copy(acceptedEula.toPath(), new File(instance, 'eula.txt').toPath())
            new File(world, 'colonyloom-test-world').text = 'Disposable Colonyloom recovery runner: ' + scenario + '\n'
            new File(instance, 'server.properties').text = '''level-name=world
level-seed=424242
level-type=minecraft:flat
generator-settings={"biome":"minecraft:plains","layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":2},{"block":"minecraft:grass_block","height":1}]}
online-mode=false
server-port=0
enable-rcon=false
enable-query=false
spawn-protection=0
view-distance=6
simulation-distance=6
gamemode=survival
difficulty=peaceful
spawn-monsters=false
spawn-animals=false
max-tick-time=120000
'''
            def phases = scenario.endsWith('_clean') ? ['initialize','exercise','verify'] : ['initialize','exercise','verify','accept']
            phases.each { phase ->
                boolean fault = phase == 'exercise' && !scenario.endsWith('_clean')
                int expectedExit = fault ? 97 : 0
                def argv = [run.javaLauncher.get().executablePath.asFile.absolutePath]
                argv.addAll(run.allJvmArgs)
                argv.addAll(['-Dcolonyloom.test.identityAction=','-Dcolonyloom.test.constructionScenario=','-Dcolonyloom.test.platformScenario=',
                        '-Dcolonyloom.test.recoveryScenario=' + scenario,'-Dcolonyloom.test.recoveryPhase=' + phase,'-Dcolonyloom.testFaults=' + fault])
                def launchClasspath = run.classpath + run.classpathProvider
                if (!launchClasspath.isEmpty()) argv.addAll(['-cp',launchClasspath.asPath])
                argv.add(run.mainClass.get()); argv.addAll(run.args)
                def stdout = new File(instance,phase + '.stdout.log'), stderr = new File(instance,phase + '.stderr.log')
                def builder = new ProcessBuilder(argv.collect { it.toString() }).directory(instance)
                run.environment.each { key,value -> builder.environment().put(key.toString(),value.toString()) }
                run.environmentProperty.get().each { key,value -> builder.environment().put(key.toString(),value.toString()) }
                builder.redirectOutput(stdout).redirectError(stderr)
                long started = System.nanoTime()
                def child = builder.start()
                boolean exited = child.waitFor(420,java.util.concurrent.TimeUnit.SECONDS)
                if (!exited) {
                    child.destroy()
                    if (!child.waitFor(20,java.util.concurrent.TimeUnit.SECONDS)) child.destroyForcibly().waitFor(10,java.util.concurrent.TimeUnit.SECONDS)
                }
                def observation = new File(world,'colonyloom-recovery-observations.jsonl')
                def facts = observation.isFile() ? observation.readLines().findAll { !it.isBlank() }.collect { new groovy.json.JsonSlurper().parseText(it) }.findAll { it.scenario == scenario && it.phase == phase } : []
                boolean passed = exited && child.exitValue() == expectedExit && facts.any { it.check == phase + '_complete' && it.passed }
                        && !facts.any { !it.passed } && (fault || facts.any { it.check == 'clean_checkpoint' && it.passed })
                results.add([scenario:scenario,phase:phase,expectedExit:expectedExit,exit:child.isAlive() ? null : child.exitValue(),timedOut:!exited,
                        elapsedMillis:(System.nanoTime()-started)/1_000_000L,stdout:stdout.absolutePath,stderr:stderr.absolutePath,observation:observation.absolutePath,facts:facts,passed:passed])
                new File(report,'report.json').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                        java:run.javaLauncher.get().metadata.languageVersion.toString(),neoForge:project.neo_version,seed:424242,heap:'4GiB',phases:results]))
                if (!passed) throw new GradleException("Recovery ${scenario}/${phase} failed (exit=${child.isAlive() ? 'alive' : child.exitValue()}, expected=${expectedExit}); see ${report}")
            }
        }
        logger.lifecycle('Economic dedicated crash/restart evidence: {}',report)
    }
}
